name: Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Подготовка файла
        run: cp app/build/outputs/apk/release/app-release.apk lighthome.apk

      - name: Публикация релиза «latest»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest lighthome.apk \
            --target "$GITHUB_SHA" \
            --title "Лёгкий дом (последняя сборка)" \
            --notes "Сборка из ${GITHUB_SHA::7}." \
            --latest
